<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530"><rect width="1200" height="530" fill="#f5f9fa"/><g font-family="Microsoft YaHei, sans-serif" fill="#203844"><text x="45" y="55" font-size="28">图1 声音如何成为听觉：正常听力与人工耳蜗的两条路径</text><text x="45" y="125" font-size="22">正常听力</text><rect x="220" y="100" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="235" y="138" font-size="21">耳道与中耳</text><text x="235" y="175" font-size="17">传递声音振动</text><path d="M433 150h14l-5 -5m5 5l-5 5" stroke="#548b9c" fill="none" stroke-width="2"/><rect x="450" y="100" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="465" y="138" font-size="21">耳蜗与毛细胞</text><text x="465" y="175" font-size="17">机械振动 → 神经活动</text><path d="M663 150h14l-5 -5m5 5l-5 5" stroke="#548b9c" fill="none" stroke-width="2"/><rect x="680" y="100" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="695" y="138" font-size="21">听神经</text><text x="695" y="175" font-size="17">位置与时间信息</text><path d="M893 150h14l-5 -5m5 5l-5 5" stroke="#548b9c" fill="none" stroke-width="2"/><rect x="910" y="100" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="925" y="138" font-size="21">大脑</text><text x="925" y="175" font-size="17">形成听觉与音乐理解</text><text x="45" y="280" font-size="22">人工耳蜗</text><rect x="220" y="255" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="235" y="293" font-size="21">麦克风与处理器</text><text x="235" y="330" font-size="17">分析声音并编码</text><path d="M433 305h14l-5 -5m5 5l-5 5" stroke="#548b9c" fill="none" stroke-width="2"/><rect x="450" y="255" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="465" y="293" font-size="21">传输与植入装置</text><text x="465" y="330" font-size="17">生成电刺激脉冲</text><path d="M663 305h14l-5 -5m5 5l-5 5" stroke="#548b9c" fill="none" stroke-width="2"/><rect x="680" y="255" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="695" y="293" font-size="21">耳蜗电极阵列</text><text x="695" y="330" font-size="17">激活听神经纤维</text><path d="M893 305h14l-5 -5m5 5l-5 5" stroke="#548b9c" fill="none" stroke-width="2"/><rect x="910" y="255" width="210" height="105" rx="12" fill="white" stroke="#548b9c"/><text x="925" y="293" font-size="21">大脑</text><text x="925" y="330" font-size="17">学习理解新的信号</text><text x="45" y="480" font-size="18">概念流程，不按解剖比例；人工耳蜗绕过受损毛细胞环节，不恢复正常听力。</text></g></svg>